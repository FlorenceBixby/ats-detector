<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F0E6;
      --pink: #E8C4C0;
      --pink-deep: #C4706F;
      --burgundy: #7A2C2C;
      --burgundy-light: #9B3D3D;
      --gold: #B8924A;
      --text: #2C1810;
      --text-muted: #7A5C52;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #FDFAF5;
      border: 1.5px solid var(--pink-deep);
      padding: 3rem 3.5rem;
      position: relative;
      text-align: center;
    }

    /* Corner ornaments */
    .card::before, .card::after {
      content: '✦';
      position: absolute;
      color: var(--gold);
      font-size: 0.75rem;
      line-height: 1;
    }
    .card::before { top: 10px; left: 14px; }
    .card::after  { bottom: 10px; right: 14px; }

    .corner-tl, .corner-br {
      position: absolute;
      color: var(--gold);
      font-size: 0.75rem;
      line-height: 1;
    }
    .corner-tl { top: 10px; right: 14px; }
    .corner-br { bottom: 10px; left: 14px; }

    .header-rule {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .header-rule::before, .header-rule::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--pink-deep);
    }

    .hotel-label {
      font-family: 'EB Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--pink-deep);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--burgundy);
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--pink);
    }
    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .input-label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-align: left;
    }

    input {
      width: 100%;
      background: var(--cream);
      border: 1px solid var(--pink-deep);
      color: var(--text);
      font-family: 'EB Garamond', serif;
      font-size: 1.05rem;
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 0.02em;
      margin-bottom: 1.25rem;
    }

    input:focus { border-color: var(--burgundy); }
    input::placeholder { color: #C4A89E; font-style: italic; }

    button {
      width: 100%;
      background: var(--burgundy);
      color: var(--cream);
      border: none;
      cursor: pointer;
      font-family: 'EB Garamond', serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      transition: background 0.2s;
    }

    button:hover { background: var(--burgundy-light); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      margin: 1.5rem auto 0;
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--pink);
      border-top-color: var(--burgundy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      display: none;
      margin-top: 2rem;
      text-align: center;
    }
    .result.visible { display: block; }

    .result-rule {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .result-rule::before, .result-rule::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--pink);
    }
    .result-rule span {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ats-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--burgundy);
      margin-bottom: 0.35rem;
    }

    .ats-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      word-break: break-all;
    }
    .ats-url a { color: var(--text-muted); text-decoration: none; }
    .ats-url a:hover { color: var(--burgundy); }

    .not-found {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .ats-item + .ats-item {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--pink);
    }

    .scanned-section {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--pink);
    }

    .scanned-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C4A89E;
      margin-bottom: 0.5rem;
    }

    .scanned-url {
      font-size: 0.72rem;
      color: #C4A89E;
      font-family: 'EB Garamond', serif;
      display: block;
      line-height: 1.6;
    }

    .footer-label {
      margin-top: 2rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C4A89E;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="corner-tl">✦</span>
    <span class="corner-br">✦</span>

    <div class="header-rule">
      <span class="hotel-label">Established MMXXVI</span>
    </div>

    <h1>ATS Detector</h1>
    <p class="subtitle">Uncover the recruitment software behind any company.</p>

    <div class="divider"><div class="divider-diamond"></div></div>

    <label class="input-label" for="domain">Company Domain</label>
    <input
      id="domain"
      type="text"
      placeholder="example.com"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="detect-btn" onclick="detect()">Enquire</button>

    <div class="spinner" id="spinner"></div>

    <div class="result" id="result"></div>

    <p class="footer-label">ats.burkeruder.ai</p>
  </div>

  <script>
    document.getElementById('domain').addEventListener('keydown', e => {
      if (e.key === 'Enter') detect();
    });

    async function detect() {
      const input = document.getElementById('domain');
      const btn = document.getElementById('detect-btn');
      const spinner = document.getElementById('spinner');
      const result = document.getElementById('result');

      const domain = input.value.trim();
      if (!domain) return;

      btn.disabled = true;
      spinner.classList.add('visible');
      result.classList.remove('visible');

      try {
        const res = await fetch(`/api/detect?domain=${encodeURIComponent(domain)}`);
        const data = await res.json();

        if (data.error) {
          result.innerHTML = `<p class="not-found">${data.error}</p>`;
        } else if (!data.found) {
          result.innerHTML = `
            <div class="result-rule"><span>Result</span></div>
            <p class="not-found">No known ATS detected for <em>${data.domain}</em>.</p>
            ${scannedHtml(data.checkedUrls)}
          `;
        } else {
          const items = data.detected.map(d => `
            <div class="ats-item">
              <div class="ats-name">${d.name}</div>
              ${d.url ? `<div class="ats-url"><a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></div>` : ''}
            </div>
          `).join('');

          result.innerHTML = `
            <div class="result-rule"><span>Detected</span></div>
            ${items}
            ${scannedHtml(data.checkedUrls)}
          `;
        }

        result.classList.add('visible');
      } catch {
        result.innerHTML = `<p class="not-found">Something went wrong. Please try again.</p>`;
        result.classList.add('visible');
      } finally {
        btn.disabled = false;
        spinner.classList.remove('visible');
      }
    }

    function scannedHtml(urls) {
      if (!urls || !urls.length) return '';
      return `
        <div class="scanned-section">
          <div class="scanned-label">Pages scanned</div>
          ${urls.map(u => `<span class="scanned-url">${u}</span>`).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
